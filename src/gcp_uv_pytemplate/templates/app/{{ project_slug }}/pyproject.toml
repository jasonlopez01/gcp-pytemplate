[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{ project_module }}"]

[project]
name = "{{ project_slug }}"
version = "0.1.0"
description = "{{ project_description }}"
readme = "README.md"
authors = [
    { name = "{{ author_name }}", email = "{{ author_email }}" }
]
requires-python = ">=3.13"
dependencies = [
{%- if include_api %}
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
{%- endif %}
{%- if include_cli %}
    "typer>=0.24.1",
{%- endif %}
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "rich>=14.3.3",
    "structlog>=25.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.11.0",
]

{%- if include_cli %}

[project.scripts]
{{ project_slug }} = "{{ project_module }}.main_cli:main"
{%- endif %}

[tool.pytest.ini_options]
addopts = "--maxfail=1 --verbose -s -n=auto --dist loadscope"
testpaths = [
    "tests"
]

[tool.coverage.run]
omit = [
    "/builder/*",
    "tests/*",
    "venv/*",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
