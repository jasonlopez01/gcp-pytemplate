[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example_cli_job"]

[project]
name = "example-cli-job"
version = "0.1.0"
description = "A Typer CLI application deployed as a Cloud Run Job"
readme = "README.md"
authors = [
    { name = "Jason Lopez", email = "jasonlopez01@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "typer>=0.24.1",
    "google-auth>=2.40.0",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.13.1",
    "requests>=2.32.0",
    "rich>=14.3.3",
    "structlog>=25.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.11.0",
]

[project.scripts]
example-cli-job = "example_cli_job.main_cli:main"

[tool.pytest.ini_options]
addopts = "--maxfail=1 --verbose -s -n=auto --dist loadscope"
testpaths = [
    "tests"
]

[tool.coverage.run]
omit = [
    "/builder/*",
    "tests/*",
    "venv/*",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"