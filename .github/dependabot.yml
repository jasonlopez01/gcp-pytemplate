version: 2

# Version updates only, grouped into one PR per ecosystem on a monthly cadence. Dependabot
# security updates are disabled at the repo level so vulnerabilities raise an alert rather than
# opening PRs; those fixes ride along with the next grouped bump.
updates:
  # Root only. templates/ is Jinja2 and examples/ is generated output that must keep matching
  # `make generate-examples`.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    # chore is non-releasable, so a bump never cuts a release on its own.
    commit-message:
      prefix: "chore"
    ignore:
      # Held below the next major. Without this Dependabot widens the cap in pyproject.toml to make
      # room for the bump, rather than treating it as a constraint.
      - dependency-name: "mcp"
        versions: [">=3.0.0"]
      # python-semantic-release caps rich at <15, so a rich 15 bump has no solution and the
      # updater errors out. Drop this once PSR widens its pin.
      - dependency-name: "rich"
        versions: [">=15.0.0"]
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
