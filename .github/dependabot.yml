version: 2

# Version updates only, grouped into one PR per ecosystem on a monthly cadence. Dependabot
# security updates are disabled at the repo level so vulnerabilities raise an alert rather than
# opening PRs; those fixes ride along with the next grouped bump.
updates:
  # Root only. templates/ is Jinja2 and examples/ is generated output that must keep matching
  # `make generate-examples`.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    # chore is non-releasable, so a bump never cuts a release on its own.
    commit-message:
      prefix: "chore"
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
