[project]
name = "gcp-uv-pytemplate"
dynamic = ["version"]
description = "gcp-uv-pytemplate is a CLI tool that scaffolds production-ready Python projects for Google Cloud Platform, using [uv](https://docs.astral.sh/uv/) for package management and [Cloud Native Buildpacks](https://buildpacks.io/) for containerization. With built-in uv tooling, optional FastAPI/Typer entrypoints, GCP authentication utilities, and a CI/CD release pipeline out of the box."
readme = "README.md"
authors = [
    { name = "Jason Lopez", email = "jasonlopez01@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Code Generators",
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
    "questionary>=2.0.0",
    "rich>=14.3.3",
    "typer>=0.24.1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]

[dependency-groups]
dev = [
    "commitizen>=4.1.0",
    "mcp>=1.0.0",
    "pre-commit>=4.0.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "python-semantic-release>=9.0.0",
    "ruff>=0.11.0",
]

[project.scripts]
gcp-uv-pytemplate     = "gcp_uv_pytemplate:main"
gcp-uv-pytemplate-mcp = "gcp_uv_pytemplate.mcp_server:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

# Added -n (number of concurrent tests) and --dist=loadscope (load by class) for concurrency with pytest-xdist plugin
[tool.pytest.ini_options]
addopts = "--maxfail=1 --verbose -s -n=auto --dist loadscope"
testpaths = [
    "tests"
]

# Omit /builder/* so Coverage doesn't evaluate all installed packages when running on Cloud Build, etc.
[tool.coverage.run]
omit = [
    "/builder/*",
    "tests/*",
    "venv/*",
    "examples/*",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
# Exclude the templates because they aren't valid Python until rendered
extend-exclude = [
    "src/gcp_uv_pytemplate/templates/**",
]

[tool.semantic_release]
commit_parser = "conventional"
tag_format = "v{version}"
build_command = "uv build"

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = [
    '''chore(?:\([^)]*?\))?: .+''',
    '''ci(?:\([^)]*?\))?: .+''',
    '''style(?:\([^)]*?\))?: .+''',
    '''test(?:\([^)]*?\))?: .+''',
    '''refactor(?:\([^)]*?\))?: .+''',
]

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.publish]
upload_to_vcs_release = true

[tool.commitizen]
name = "cz_conventional_commits"
