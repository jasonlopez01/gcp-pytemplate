[project]
name = "gcp-pytemplate"
dynamic = ["version"]
description = "gcp-pytemplate is a CLI tool that scaffolds production-ready Python projects for Google Cloud Platform, using [uv](https://docs.astral.sh/uv/) for package management and [Cloud Native Buildpacks](https://buildpacks.io/) for containerization. With built-in uv tooling, optional FastAPI/Typer entrypoints, and GCP authentication utilities."
readme = "README.md"
authors = [
    { name = "Jason Lopez", email = "jasonlopez01@gmail.com" }
]
keywords = [
    "python",
    "template",
    "project-generator",
    "uv",
    "fastapi",
    "typer",
    "gcp",
    "cloud run",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Code Generators",
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
    "questionary>=2.0.0",
    "rich>=14.3.3",
    "typer>=0.24.1",
]

[project.optional-dependencies]
# Capped below 2.0: mcp 2.x dropped mcp.server.fastmcp, which mcp_server.py imports.
mcp = ["mcp>=1.0.0,<2.0.0"]

[dependency-groups]
dev = [
    "commitizen>=4.1.0",
    "mcp>=1.0.0,<2.0.0",  # keep in step with the [mcp] extra above
    "pre-commit>=4.0.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "python-semantic-release>=9.0.0",
    "ruff>=0.11.0",
]

[project.scripts]
gcp-pytemplate     = "gcp_pytemplate:main"
gcp-pytemplate-mcp = "gcp_pytemplate.mcp_server:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

# Hatchling honours .gitignore, but not a user's global gitignore, so per-machine files can still
# reach the sdist. Exclude them explicitly rather than relying on how any one clone is configured.
[tool.hatch.build.targets.sdist]
exclude = [
    "/.claude",
]

# Added -n (number of concurrent tests) and --dist=loadscope (load by class) for concurrency with pytest-xdist plugin
[tool.pytest.ini_options]
addopts = "--maxfail=1 --verbose -s -n=auto --dist loadscope"
testpaths = [
    "tests"
]

# Omit /builder/* so Coverage doesn't evaluate all installed packages when running on Cloud Build, etc.
[tool.coverage.run]
omit = [
    "/builder/*",
    "tests/*",
    "venv/*",
    "examples/*",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py313"
# Exclude the templates because they aren't valid Python until rendered
extend-exclude = [
    "src/gcp_pytemplate/templates/**",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.semantic_release]
commit_parser = "conventional"
tag_format = "v{version}"
# Deliberately no build_command. The PSR GitHub Action runs inside its own container, which has
# no uv on PATH, so building there fails with exit 127. The workflow builds on the runner after
# PSR has created the tag instead; see .github/workflows/release.yml.
# Stay on 0.x while the project is alpha: a breaking change bumps the minor rather than
# jumping to 1.0.0. Flip major_on_zero back to true when the API is ready to be committed to.
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = [
    '''chore(?:\([^)]*?\))?: .+''',
    '''ci(?:\([^)]*?\))?: .+''',
    '''style(?:\([^)]*?\))?: .+''',
    '''test(?:\([^)]*?\))?: .+''',
    '''refactor(?:\([^)]*?\))?: .+''',
]

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.publish]
upload_to_vcs_release = true

[tool.commitizen]
name = "cz_conventional_commits"
